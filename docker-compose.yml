version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: callfar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: callfar_prod_secret_password
      POSTGRES_DB: callfar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. CallFar API & WebRTC Signaling Backend
  backend:
    build:
      context: ./callfar-backend
      dockerfile: Dockerfile
    container_name: callfar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:callfar_prod_secret_password@postgres:5432/callfar?schema=public
      JWT_ACCESS_SECRET: callfar_super_secret_access_key_replace_in_prod
      JWT_REFRESH_SECRET: callfar_super_secret_refresh_key_replace_in_prod
      STUN_SERVERS: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      TURN_SERVER_URL: turn:turn.callfar.app:3478
      TURN_SERVER_USERNAME: callfar_user
      TURN_SERVER_CREDENTIAL: CallFarSecureTurnPass2026!
    ports:
      - "5000:5000"

  # 3. Coturn STUN & TURN Relay Server
  coturn:
    image: coturn/coturn:latest
    container_name: callfar-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49160:49152-49160/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    network_mode: "host"

volumes:
  pgdata:
